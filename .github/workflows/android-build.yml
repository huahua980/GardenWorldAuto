name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予gradlew执行权限
        run: chmod +x ./gradlew

      - name: 编译Release APK
        run: ./gradlew assembleRelease

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: GardenWorldAuto_APK
          path: app/build/outputs/apk/release/*.apk
